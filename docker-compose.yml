# Local development infrastructure for Pressly.
#
# One service. Redis and Meilisearch used to live here too — Redis for the
# BullMQ worker, Meilisearch for the ⌘K palette. The worker is gone (publishing
# happens inline) and search is a Postgres tsvector, so neither is needed.
# Production is Neon Postgres; this is the local equivalent.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pressly
      POSTGRES_PASSWORD: pressly
      POSTGRES_DB: pressly
    ports:
      # Host 5435 avoids clashing with a local Homebrew Postgres on 5432.
      - "5435:5432"
    volumes:
      - pressly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pressly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pressly_pg:
